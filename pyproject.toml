[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csci576-pipeline"
version = "0.1.0"
description = "Multimodal video segmentation and advertisement detection player"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "scenedetect>=0.6.5",
]

[project.optional-dependencies]
player = ["PySide6>=6.7"]
speech = ["faster-whisper", "huggingface_hub"]
ocr = ["easyocr>=1.7.2"]
semantic = ["sentence-transformers>=3.0.0", "scikit-learn>=1.8.0"]

[tool.setuptools]
py-modules = ["player_fusion"]
packages = [
    "audio", "visual", "fusion",
    "schemas", "player", "scripts", "Automatic_speech_recognition", "ocr", "semantic",
]
include-package-data = false

[tool.setuptools.package-data]
fusion = ["ad_signals.json", "extra_brand_names.txt"]
